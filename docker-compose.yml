services:
  reverse-proxy:
    image: nginx:alpine
    container_name: sthanori-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
    networks:
      - sthanori-network

  postgres:
    image: postgres:17-alpine
    container_name: sthanori-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sthanori
      POSTGRES_PASSWORD: sthanori_dev_password
      POSTGRES_DB: sthanori_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sthanori -d sthanori_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sthanori-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sthanori-api
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgresql://sthanori:sthanori_dev_password@postgres:5432/sthanori_dev
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sthanori-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sthanori-web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - sthanori-network

networks:
  sthanori-network:
    driver: bridge

volumes:
  postgres_data:
